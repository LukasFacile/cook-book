<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browse and search recipes." />
    <title>Recipes</title>
    <link rel="stylesheet" href="web/styles.css" />
    <script src="web/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#recipes">Skip to recipes</a>
    <main>
      <header class="masthead">
        <h1>Recipes</h1>
        <button id="print" type="button" hidden>Print recipes</button>
      </header>
      <section aria-label="Recipe collection">
        <div class="collection-bar">
          <div class="collection-title">
            <span id="count" role="status">{{COUNT}} recipe(s)</span>
          </div>
          <div id="search-controls" hidden>
            <label class="sr-only" for="search"
              >Search recipes, ingredients, or tags</label
            ><input
              id="search"
              type="search"
              placeholder="Search recipes, ingredients…"
              autocomplete="off"
            />
          </div>
        </div>
        <div id="recipes"><!-- RECIPES --></div>
        <div id="empty" class="empty" hidden>
          <h2>No recipes found.</h2>
          <button id="clear" type="button">Clear search</button>
        </div>
      </section>
    </main>
  </body>
</html>
